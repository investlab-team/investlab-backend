name: "버그 수정"
description: "할 일과 완료 조건을 간단히 기록합니다."
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "기본 틀을 실제 작업에 맞게 수정하세요. 담당자는 오른쪽 Assignees, 일정은 Project에서 관리합니다. 완료 기준은 결과를 확인한 뒤 직접 체크합니다."
  - type: textarea
    id: problem
    attributes:
      label: 문제와 재현 방법
      value: |
        발생하는 문제:

        재현 순서:
        1.
        2.

        예상 결과:
        실제 결과:
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 기준
      description: 무엇을 확인하면 작업 완료인지 적어주세요. 검증 방법은 테스트 코드 또는 직접 확인 등 작업에 맞게 선택합니다.
      value: |
        - [ ] 재현 순서대로 실행해도 문제가 발생하지 않는다.
        - [ ] 기존 정상 동작이 유지된다.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: 참고 사항 (선택)
      description: 관련 API·이슈·다른 레포 작업, DB·환경 변수 변경이 있을 때만 작성하세요. 없으면 비워둡니다.
      placeholder: "예: 관련 이슈 URL / 변경할 API / 추가할 환경 변수"
    validations:
      required: false
