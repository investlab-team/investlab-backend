name: "버그 수정"
description: "할 일과 완료 조건을 간단히 기록합니다."
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "기본 틀을 실제 작업에 맞게 수정하세요. 담당자는 아래 입력란에 이름 / @아이디로 작성하고, 일정은 Project에서 관리합니다. 완료 기준은 결과를 확인한 뒤 직접 체크합니다."
  - type: input
    id: owner
    attributes:
      label: 담당자
      description: 작업할 사람의 이름과 GitHub 아이디를 입력하세요. 이 입력은 GitHub Assignees를 자동 지정하지 않습니다.
      placeholder: "예: 송상진 / @song-sang-jin"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 문제와 재현 방법
      value: |
        발생하는 문제:

        재현 순서:
        1.
        2.

        예상 결과:
        실제 결과:
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 기준
      description: 무엇을 확인하면 작업 완료인지 적어주세요. 검증 방법은 테스트 코드 또는 직접 확인 등 작업에 맞게 선택합니다.
      value: |
        - [ ] 재현 순서대로 실행해도 문제가 발생하지 않는다.
        - [ ] 기존 정상 동작이 유지된다.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: 추가 사항 (선택)
      description: |
        필요한 내용만 골라 적으세요. 모두 작성할 필요는 없고, 없으면 기본값 '없음'을 유지하세요.
        - 관련 API 예: POST /api/v1/example (실제 명세의 경로로 작성)
        - 관련 이슈 예: 선행 작업 #이슈번호 또는 이슈 URL
        - 다른 레포 영향 예: AI 응답 형식 변경으로 백엔드도 수정 필요 (자신의 레포명은 반복하지 않음)
        - 배포 영향 예: DB 변경 적용 후 백엔드 배포 필요
        - 환경 변수 예: SOME_API_KEY 추가 필요 (이름만 작성, 실제 비밀값 금지)
        - DB 변경 예: 회원 테이블에 신규 컬럼 추가 및 마이그레이션 필요
      value: "없음"
    validations:
      required: false
