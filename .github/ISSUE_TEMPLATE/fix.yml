name: "버그 수정"
description: "오류를 재현하고 수정할 때 선택합니다."
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        작업 전에 이슈를 등록합니다. 아래 틀을 실제 작업에 맞게 수정하세요.
        체크리스트는 이미 입력되어 있으니 내용을 바꾸면 됩니다. 완료한 항목은 등록 후 체크하세요.
        회의에서 변경 내용과 검증 결과를 설명하고 CI 통과 후 작성자가 자신의 PR을 머지할 수 있습니다.
  - type: input
    id: owner
    attributes:
      label: 담당자
      description: "이 작업을 진행할 사람의 이름과 GitHub 계정입니다. 오른쪽 Assignees도 직접 지정하세요."
      placeholder: "예: 유광민 (@github-id)"
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: "어떤 오류를 고치나요?"
      description: "현재 문제, 재현 방법, 기대하는 결과를 적습니다."
      value: |
        ### 현재 문제

        ### 재현 방법
        1.
        2.

        ### 기대하는 결과

    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: "무엇을 확인하면 이 작업이 끝났다고 볼 수 있나요? 아래 기본 조건을 실제 결과에 맞게 바꾸세요. 예: 올바른 로그인 정보로 JWT가 발급된다."
      value: |
        - [ ] 재현 방법대로 실행해도 같은 오류가 발생하지 않는다.
        - [ ] 기대하는 결과가 나온다.
        - [ ] 관련 기능이 정상 동작한다.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: 연결된 작업
      description: "함께 진행하거나 먼저 완료해야 하는 이슈·PR·API 문서입니다. 다른 레포와 함께 수정해야 하면 링크를 적고, 없으면 기본값을 유지하세요."
      value: |
        없음
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: 확인 방법과 영향
      description: "완료 조건을 어떻게 테스트할지 적습니다. 다른 기능·DB·배포에 영향이 없다면 없음으로 적으세요."
      value: |
        ### 확인 방법
        - [ ] 내용을 적으세요.

        ### 다른 기능·DB·배포에 미치는 영향
        없음
    validations:
      required: true
