name: "설정·문서·인프라 작업"
description: "설정·문서·인프라 작업 이슈를 필수 항목으로 등록합니다."
title: "chore: "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: "모든 작업은 이슈 등록 후 시작합니다. 작성자는 자신의 PR을 머지하지 않습니다."
  - type: input
    id: owner
    attributes:
      label: 담당자
      description: 실명과 GitHub 계정명. 백엔드 기능 분담은 이슈에서 합의합니다.
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: 목적과 변경 내용
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 기준
      placeholder: "- [ ] 검증 가능한 완료 조건"
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: 관련 레포·API·이슈
      description: 영향이 없으면 해당 없음. 다른 레포 이슈는 전체 URL로 연결합니다.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: 검증 계획·배포 영향
    validations:
      required: true
