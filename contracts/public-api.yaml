openapi: 3.1.0
info:
  title: InvestLab Public API
  version: 0.1.0
  description: 초기 보안 뼈대 계약. 도메인 API는 기존 PDF를 기준으로 후속 이슈에서 확장합니다.
externalDocs:
  description: API 명세 및 A·B·C 담당 안내
  url: https://github.com/investlab-team/investlab-backend/blob/dev/docs/api/README.md
paths:
  /actuator/health:
    get:
      operationId: health
      security: []
      responses:
        '200':
          description: 서비스 준비 상태 정상
        '503':
          description: 의존 서비스 상태 이상
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []
