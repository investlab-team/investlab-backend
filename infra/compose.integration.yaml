services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: investlab_admin
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local admin password}
      CORE_DB_PASSWORD: ${CORE_DB_PASSWORD:?Set a local database password}
      RESEARCH_DB_PASSWORD: ${RESEARCH_DB_PASSWORD:?Set a local database password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
  backend:
    profiles: [apps]
    build: ..
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/investlab_core
      DB_USERNAME: investlab_core
      DB_PASSWORD: ${CORE_DB_PASSWORD:?Set CORE_DB_PASSWORD}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:?Set a random base64 JWT key}
      AI_BASE_URL: http://ai:8000
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
  ai:
    profiles: [apps]
    build: ../../investlab-ai
    environment:
      RESEARCH_DB_HOST: postgres
      RESEARCH_DB_PORT: "5432"
      RESEARCH_DB_NAME: investlab_research
      RESEARCH_DB_USERNAME: investlab_research
      RESEARCH_DB_PASSWORD: ${RESEARCH_DB_PASSWORD:?Set RESEARCH_DB_PASSWORD}
      INVESTLAB_AI_SERVICE_TOKEN: ${INVESTLAB_AI_SERVICE_TOKEN:?Set a random service token}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres-data:
